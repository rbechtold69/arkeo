name: Sentinel readiness regression
on:
  pull_request:
    paths: ['sentinel/**', '.github/workflows/readiness-sentinel.yml']
permissions:
  contents: read
jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Report Go formatting
        run: go run golang.org/x/tools/cmd/goimports@v0.30.0 -local github.com/arkeonetwork/arkeo -d sentinel/arkeo_auth.go sentinel/claim_store.go sentinel/event_stream.go sentinel/memstore.go sentinel/memstore_test.go sentinel/nonce_store.go sentinel/payment_safety_test.go sentinel/sentinel.go sentinel/sentinel_auth.go
      - run: go test -race ./sentinel/... ./x/arkeo/keeper/... ./x/arkeo/types/...
